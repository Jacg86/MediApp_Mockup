<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirma tu dirección de entrega para tu pedido de MediApp.">
    <title>Domicilio | MediApp</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body class="home-body">

<nav class="main-nav">
    <div class="nav-container">
        <div class="nav-left">
            <a href="home.html" class="nav-logo">
                <svg viewBox="0 0 24 24" fill="none" class="logo-svg" stroke="#2de07b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>MediApp</span>
            </a>
        </div>
        <div class="nav-right">
            <a href="perfil-persona.html" class="nav-avatar-link"><div class="user-avatar"></div></a>
        </div>
    </div>
</nav>

<main class="home-main">

    <div class="section-header">
        <h1>Entrega a domicilio</h1>
        <p>Confirma la dirección de entrega para tu pedido</p>
    </div>

    <div class="profile-card" style="max-width:600px;">
        <form id="pedido-form">
            <div class="form-group">
                <label for="delivery-address">Dirección</label>
                <input type="text" id="delivery-address" placeholder="Calle 10 #25-30, Apto 201" required>
            </div>

            <div class="form-group">
                <label for="delivery-city">Ciudad</label>
                <input type="text" id="delivery-city" placeholder="Santa Marta" required>
            </div>

            <div class="form-group">
                <label for="delivery-phone">Teléfono de contacto</label>
                <input type="text" id="delivery-phone" placeholder="3001234567">
            </div>

            <!-- Selección de Método de Pago -->
            <div class="form-group" style="margin-top: 24px;">
                <label>Método de Pago</label>
                <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <label class="radio-container" style="display: flex; align-items: center; gap: 8px;">
                        <input type="radio" name="payment_method" value="efectivo" checked>
                        Efectivo contra entrega
                    </label>
                    <label class="radio-container" style="display: flex; align-items: center; gap: 8px;">
                        <input type="radio" name="payment_method" value="tarjeta">
                        Tarjeta / Stripe
                    </label>
                </div>
            </div>

            <!-- Contenedor de Stripe (oculto por defecto) -->
            <div id="stripe-container" style="display: none; margin-top: 16px; padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa;">
                <div id="card-element">
                    <!-- Stripe inyectará el iframe del input aquí -->
                </div>
                <div id="card-errors" role="alert" style="color: #ef4444; font-size: 13px; margin-top: 8px;"></div>
            </div>

            <div class="card-actions" style="margin-top: 32px;">
                <button type="submit" class="btn-submit" id="btn-confirmar-pedido" style="width:100%;padding:0 40px;">
                    Confirmar pedido
                </button>
            </div>
        </form>
    </div>

</main>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/pedido.js"></script>
</body>
</html>
